name = "cogosphere-platform"

compatibility_date = "2026-07-07"

workers_dev = true


[vars]

PROJECT_NAME = "Cogosphere"
ENVIRONMENT = "production"


# API Worker

[[routes]]

pattern = "api.cogosphere.org/*"
zone_name = "cogosphere.org"


# R2 Storage

[[r2_buckets]]

binding = "MODEL_STORAGE"

bucket_name = "cogosphere-models"


[[r2_buckets]]

binding = "ARTIFACT_STORAGE"

bucket_name = "cogosphere-artifacts"