name: Release


on:

  workflow_dispatch:


  push:

    tags:

      - "v*"



jobs:


  release:


    runs-on: ubuntu-latest



    permissions:

      contents: write



    steps:


      - name: Checkout
        uses: actions/checkout@v5



      - name: Create Release

        uses: softprops/action-gh-release@v2

        with:

          generate_release_notes: true