name:
 Deploy Cloudflare Worker


on:

 push:

  branches:

   - main



jobs:


 deploy:


  runs-on:
    ubuntu-latest


  defaults:

    run:

      working-directory:
        cloudflare/workers/api-gateway



  steps:


  - uses:
      actions/checkout@v4



  - name:
      Install

    run:

      npm install



  - name:
      Deploy Worker

    run:

      npx wrangler deploy


    env:


      CLOUDFLARE_API_TOKEN:

        ${{ secrets.CLOUDFLARE_API_TOKEN }}


      CLOUDFLARE_ACCOUNT_ID:

        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}