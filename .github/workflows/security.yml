name: Security Audit


on:

  schedule:

    - cron: "0 6 * * 1"


  workflow_dispatch:



jobs:


  audit:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v5



      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1



      - name: Install Cargo Audit
        run:

          cargo install cargo-audit



      - name: Security Audit
        run:

          cargo audit