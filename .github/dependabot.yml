version: 2


updates:


  # Rust dependencies

  - package-ecosystem: cargo

    directory: "/"

    schedule:

      interval: weekly


    labels:

      - dependencies
      - rust



  # GitHub Actions

  - package-ecosystem: github-actions

    directory: "/"

    schedule:

      interval: weekly


    labels:

      - dependencies
      - github-actions



  # Docker

  - package-ecosystem: docker

    directory: "/"

    schedule:

      interval: monthly


    labels:

      - dependencies
      - docker